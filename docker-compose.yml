version: '3.8'

services:
  cybermemory-dashboard:
    build: .
    container_name: cybermemory_soc_dashboard
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=cybermemory-production-token
      - HINDSIGHT_BANK_ID=cybermemory-soc-v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/dashboard')"]
      interval: 30s
      timeout: 10s
      retries: 3
