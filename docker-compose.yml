services:
  cybermemory-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybermemory_soc_dashboard
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-cybermemory-local-demo-only}
      - HINDSIGHT_BANK_ID=cybermemory-soc-v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/dashboard')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cybermemory-net

  cybermemory-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybermemory_api
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "60", "cybermemory.api.app:create_app()"]
    ports:
      - "5001:5000"
    environment:
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-}
      - HINDSIGHT_API_URL=${HINDSIGHT_API_URL:-http://hindsight-memory:8888}
      - HINDSIGHT_DEFAULT_BANK_ID=${HINDSIGHT_DEFAULT_BANK_ID:-cybermemory_soc_demo}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - OPERATIONAL_MODE=READ_ONLY_ANALYSIS
      - PORT=5000
    depends_on:
      - hindsight-memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cybermemory-net

  hindsight-memory:
    image: vectorizeio/hindsight:latest
    container_name: hindsight_memory
    ports:
      - "8888:8888"
    volumes:
      - hindsight_data:/data
    restart: unless-stopped
    networks:
      - cybermemory-net

volumes:
  hindsight_data:
    driver: local

networks:
  cybermemory-net:
    driver: bridge
